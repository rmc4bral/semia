# SemIA · versión de prueba en GitHub Pages (sin servidor: modo local, datos en cada celular)
# Se activa creando la variable del repositorio PAGES = 1 y eligiendo Settings → Pages → Source: GitHub Actions.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  pages:
    if: ${{ vars.PAGES == '1' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Solo archivos estáticos (sin PHP, sin datos de servidor)
        run: |
          mkdir -p _site
          cd public_html
          cp index.html script.js style.css tiff.js pdf.js pdf.worker.js manifest.json sw.js icon.svg icon-192.png icon-512.png ../_site/
          touch ../_site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4

# acopia · versión de prueba en GitHub Pages (sin servidor: modo local, datos en cada celular)
# Publica los archivos estáticos en la rama gh-pages. En Settings → Pages:
# Source = Deploy from a branch · Branch = gh-pages / (root)
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: pages

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Solo archivos estáticos (sin PHP, sin datos de servidor)
        run: |
          mkdir -p _site
          cd public_html
          cp index.html version.json script.js style.css tiff.js pdf.js pdf.worker.js manifest.json sw.js icon.svg icon-192.png icon-512.png ../_site/ && cp -r fonts ../_site/
          touch ../_site/.nojekyll
      - name: Subir a la rama gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "semia-bot"; git config user.email "semia-bot@users.noreply.github.com"
          git add -A && git commit -q -m "acopia ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

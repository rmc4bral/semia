# GitHub Pages ya no publica la app: la versión de prueba se mudó a acopia.app.
# rmc4bral.github.io/semia muestra un aviso que lleva a acopia.app (y ofrece descargar
# los datos de prueba que hayan quedado en ese navegador). Se publica solo a mano.
name: Publicar aviso en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/redirect/**', '.github/workflows/pages.yml']

permissions:
  contents: write

concurrency: pages

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aviso de mudanza (sin la app)
        run: |
          mkdir -p _site && cp tools/redirect/index.html _site/index.html && cp tools/redirect/index.html _site/404.html && cp tools/redirect/sw.js _site/sw.js
          touch _site/.nojekyll
      - name: Subir a la rama gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "acopia-bot"; git config user.email "acopia-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Aviso: Acopia se mudó a acopia.app"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
